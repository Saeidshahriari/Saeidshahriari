name: Update Profile Stats

on:
  # Runs only when you push a real change to the profile repo (no daily timer)
  push:
    branches: [main]
    paths-ignore:
      - "status.svg"   # ignore the bot's own auto-commit so it does not loop
  workflow_dispatch: # Allows manual trigger from the GitHub UI

# Prevent overlapping runs
concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run SVG Generator Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add status.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update profile SVG [skip ci]" && git push)
